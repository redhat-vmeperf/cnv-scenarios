apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    kubevirt-vm: vm-{{.name}}-{{.Replica}}
    test-type: cpu-limits
{{- range $key, $value := .vmLabels }}
    {{ $key }}: {{ $value }}
{{- end }}
  name: {{.name}}-{{.Replica}}
spec:
  runStrategy: {{ if .VMIrunning }}Always{{ else }}Halted{{ end }}
  template:
    metadata:
      labels:
        kubevirt-vm: vm-{{.name}}-{{.Replica}}
        kubevirt.io/os: {{.OS}}
        test-type: cpu-limits
{{- range $key, $value := .vmLabels }}
        {{ $key }}: {{ $value }}
{{- end }}
    spec:
      accessCredentials:
      - sshPublicKey:
          propagationMethod:
            noCloud: {}
          source:
            secret:
              secretName: "{{ .sshPublicKeySecret }}-{{ .counter }}"
      {{- if .nodeSelector }}
      {{- $nsParts := splitList "=" .nodeSelector }}
      nodeSelector:
        {{ index $nsParts 0 | quote }}: {{ index $nsParts 1 | quote }}
      {{- end }}
      domain:
        {{- if eq (.bootloaderEfi | toString) "true" }}
        firmware:
          bootloader:
            efi: {}
        {{- end }}
        cpu:
          cores: {{.cpuCores}}
          sockets: {{.cpuSockets}}
          maxSockets: {{.cpuMaxSockets}}
        devices:
          disks:
          - disk:
              bus: virtio
            name: rootdisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - masquerade: {}
            model: virtio
            name: default
          networkInterfaceMultiqueue: true
          rng: {}
        resources:
          requests:
            memory: {{.memory}}
      networks:
      - name: default
        pod: {}
      volumes:
      - dataVolume:
          name: dvclone-{{.Replica}}
        name: rootdisk
      - cloudInitNoCloud:
          userData: |-
            #cloud-config
            user: fedora
            password: fedora
            chpasswd: { expire: False }
            ssh_authorized_keys:
              - {{ .publicKey | ReadFile }}
            runcmd:
              # Prefer stress-ng; fall back to shell CPU burn if dnf OOMs (e.g. <512Mi RAM).
              - |
                if ! command -v stress-ng >/dev/null 2>&1; then
                  dnf install -y --setopt=install_weak_deps=False --setopt=tsflags=nodocs stress-ng || true
                fi
                if command -v stress-ng >/dev/null 2>&1; then
                  nohup stress-ng --cpu "$(nproc)" --timeout 0 >/dev/null 2>&1 &
                else
                  n="$(nproc)"
                  i=0
                  while [ "${i}" -lt "${n}" ]; do
                    # Marker must appear in argv (ps aux), not only in environ.
                    nohup /bin/bash -c 'CNV_CPU_BURN=1; while true; do :; done' >/dev/null 2>&1 &
                    i=$((i + 1))
                  done
                fi
        name: cloudinitdisk
  dataVolumeTemplates:
  - metadata:
      name: dvclone-{{.Replica}}
    spec:
      source:
            http:
                url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
      storage:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: {{.storage}}
        storageClassName: {{.storageclass}}
        volumeMode: {{.volumemode}}