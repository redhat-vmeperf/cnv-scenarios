apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    kubevirt-vm: vm-{{.name}}-{{.Replica}}
    test-type: disk-limits
    {{- range $key, $value := .vmLabels }}
    {{ $key }}: {{ $value }}
    {{- end }}
  name: {{.name}}-{{.Replica}}
spec:
  runStrategy: {{ if .VMIrunning }}Always{{ else }}Halted{{ end }}
  template:
    metadata:
      labels:
        kubevirt-vm: vm-{{.name}}-{{.Replica}}
        kubevirt.io/os: {{.OS}}
        test-type: disk-limits
        {{- range $key, $value := .vmLabels }}
        {{ $key }}: {{ $value }}
        {{- end }}
    spec:
      accessCredentials:
      - sshPublicKey:
          propagationMethod:
            noCloud: {}
          source:
            secret:
              secretName: "{{ .sshPublicKeySecret }}-{{ .counter }}"
      {{- if .nodeSelector }}
      nodeSelector:
        {{ .nodeSelector }}
      {{- end }}
      domain:
        cpu:
          cores: {{.cpuCores}}
        devices:
          disks:
          - disk:
              bus: virtio
            name: rootdisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          {{- range $i := until (.diskCount | int) }}
          - disk:
              bus: {{ $.diskBus | default "scsi" }}
            name: datadisk-{{ add $i 1 }}
          {{- end }}
          interfaces:
          - masquerade: {}
            model: virtio
            name: default
          networkInterfaceMultiqueue: true
          rng: {}
        resources:
          requests:
            memory: {{.memory}}
      networks:
      - name: default
        pod: {}
      volumes:
      - dataVolume:
          name: dvclone-{{.Replica}}
        name: rootdisk
      - cloudInitNoCloud:
          userData: |-
            #cloud-config
            user: fedora
            password: fedora
            chpasswd: { expire: False }
            users:
              - name: fedora
                groups: sudo
                shell: /bin/bash
                sudo: ["ALL=(ALL) NOPASSWD:ALL"]
                lock_passwd: false
                passwd: "$6$rounds=4096$Dse4F4jd$ZXYQ54DR.bIbU2J3ptBDEfU23gn7KSkv/tI2kDqR8RJJUY9QmNLq/2PZGEpxR3vAY3oUOZsG08QUlMFZPqClz/"

            chpasswd:
              expire: false

        name: cloudinitdisk
      {{- range $i := until (.diskCount | int) }}
      - dataVolume:
          name: datadisk-{{ add $i 1 }}-{{$.Replica}}
        name: datadisk-{{ add $i 1 }}
      {{- end }}

  dataVolumeTemplates:
  - metadata:
      name: dvclone-{{.Replica}}
    spec:
      source:
            http:
                url: {{.url}}
      storage:
        accessModes:
        - ReadWriteMany
        resources:
          requests:
            storage: 20Gi
        storageClassName: {{.storageclass}}
        volumeMode: Block
  {{- range $i := until (.diskCount | int) }}
  - metadata:
      name: datadisk-{{ add $i 1 }}-{{$.Replica}}
    spec:
      source:
        blank: {}
      storage:
        accessModes:
        {{- if eq $.volumemode "Filesystem" }}
        - ReadWriteOnce
        {{- else }}
        - ReadWriteMany
        {{- end }}
        resources:
          requests:
            storage: {{$.storage}}
        storageClassName: {{$.storageclass}}
        volumeMode: {{$.volumemode}}
  {{- end }}